[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prist-ris"
version = "0.1.0"
description = "Prior-guided structured progressive spatio-temporal RIS channel reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "h5py>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prist-ris = "prist_ris.cli:main"

[tool.setuptools.packages.find]
include = ["prist_ris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
